name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repository is public. GitHub's own secret scanning covers known
      # provider formats; this covers the shapes it does not, and fails the
      # build rather than opening an alert nobody reads.
      - name: Refuse committed secrets
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          git grep -nIE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!*.md' && fail "private key committed" || true
          git grep -nIE -- 'GOCSPX-[A-Za-z0-9_-]{10,}' && fail "Google client secret committed" || true
          # An actual value assigned to anything ending in _SECRET, outside docs.
          # Two shapes count as a hit; a bare reference like required('X_SECRET')
          # matches neither, since nothing quoted or unquoted follows an `=`/`:`:
          #   1. a quoted literal:            X_SECRET = "at least 8 chars"
          #   2. a line-start env assignment: X_SECRET=at_least_8_unquoted_chars
          git grep -nIE \
            -e '[A-Z_]*_SECRET[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9/+_-]{8,}' \
            -e '^[A-Z_]*_SECRET=[A-Za-z0-9/+_-]{8,}' \
            -- . ':!*.md' ':!.env.example' ':!.github/**' && fail "secret assigned in tracked file" || true
          echo "no committed secrets found"
