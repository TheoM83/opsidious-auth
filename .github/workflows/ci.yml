name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repository is public. GitHub's own secret scanning covers known
      # provider formats; this covers the shapes it does not, and fails the
      # build rather than opening an alert nobody reads.
      - name: Refuse committed secrets
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          git grep -nIE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!*.md' && fail "private key committed" || true
          git grep -nIE -- 'GOCSPX-[A-Za-z0-9_-]{10,}' && fail "Google client secret committed" || true
          # An actual value assigned to anything ending in _SECRET, outside docs.
          # Two shapes count as a hit; a bare reference like required('X_SECRET')
          # matches neither, since nothing quoted or unquoted follows an `=`/`:`:
          #   1. a quoted literal:   X_SECRET = "at least 8 chars"
          #   2. an unquoted value:  X_SECRET=at_least_8_unquoted_chars
          # Pattern 2 used to be anchored to the start of the line (^), which
          # missed `export X_SECRET=...`, an indented assignment, and a YAML
          # `X_SECRET: value` mapping (`:` wasn't even in this pattern - only
          # `=` was) - all real shapes a secret can be committed in, none of
          # them line-start. Unanchored and matching either separator here,
          # but `_SECRET` must still be glued directly to `[=:]` with no space
          # in between (only after it, where `[[:space:]]*` allows one) -
          # that's what keeps this from matching `GOOGLE_CLIENT_SECRET =
          # required('GOOGLE_CLIENT_SECRET')` (lib/config.js): there is a
          # space before that `=`, and `required` alone is 8+ characters.
          git grep -nIE \
            -e '[A-Z_]*_SECRET[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9/+_-]{8,}' \
            -e '[A-Z_]*_SECRET[=:][[:space:]]*[A-Za-z0-9/+_-]{8,}' \
            -- . ':!*.md' ':!.env.example' ':!.github/**' && fail "secret assigned in tracked file" || true
          echo "no committed secrets found"
