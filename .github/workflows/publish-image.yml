name: Publish container image

# Gated on CI (ci.yml's "CI" workflow) actually passing. `needs:` only works
# between jobs in the same workflow file, and this publish/deploy pipeline
# and the test suite are deliberately separate workflows, so the dependency
# has to be expressed as workflow_run: build-push runs only once CI has
# *completed*, and its own `if:` below then checks that CI's conclusion was
# a success before doing anything. Without this, a push with a red suite
# still built the image and SSHed into the server to redeploy it - for an
# identity provider, the one gate worth adding.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    # workflow_dispatch is a deliberate manual run with no CI result to
    # check - allowed through unconditionally. A workflow_run event fires
    # whether CI passed or failed, so that path must check the conclusion
    # itself; skipping the job (rather than failing it) leaves no image
    # published and no deploy attempted, exactly as if this workflow had
    # never run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A workflow_run event checks out main by default, not the commit
          # CI actually tested - pin explicitly to the commit that earned
          # this run, so the image built here is the image CI passed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Redeploy on the server. continue-on-error so a missing secret still
      # leaves the image published. Only for the CI-gated path, not a manual
      # workflow_dispatch - matches this step's previous `push`-only scope.
      # This repository deploys itself. The server's repository holds neither
      # this stack's compose fragment nor its secrets - see
      # mercury/docs/architecture-deploiement.md. The compose project name
      # `opsidious-auth` is part of that contract: it namespaces the volumes.
      - name: Deploy on mercury (SSH)
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Passed through the action's env rather than interpolated into the
          # script, so the values never appear in the rendered command line.
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          script: |
            set -euo pipefail
            APP_DIR="$HOME/apps/opsidious-auth"
            mkdir -p "$APP_DIR" "$HOME/opsidious-auth/backups"
            cd "$APP_DIR"

            # The fragment is fetched from this repository, so the file the
            # server runs is always the one this commit describes.
            curl -fsSL -o docker-compose.yml \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/docker-compose.yml"

            # umask BEFORE the write, not a chmod after: between creation and a
            # later chmod the file is world-readable.
            umask 077
            cat > secrets.env <<EOF
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            EOF

            docker compose -p opsidious-auth pull
            docker compose -p opsidious-auth up -d
            echo "opsidious-auth redeployed"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
