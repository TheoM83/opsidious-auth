name: Publish container image

# Gated on CI (ci.yml's "CI" workflow) actually passing. `needs:` only works
# between jobs in the same workflow file, and this publish/deploy pipeline
# and the test suite are deliberately separate workflows, so the dependency
# has to be expressed as workflow_run: build-push runs only once CI has
# *completed*, and its own `if:` below then checks that CI's conclusion was
# a success before doing anything. Without this, a push with a red suite
# still built the image and SSHed into the server to redeploy it - for an
# identity provider, the one gate worth adding.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    # workflow_dispatch is a deliberate manual run with no CI result to
    # check - allowed through unconditionally. A workflow_run event fires
    # whether CI passed or failed, so that path must check the conclusion
    # itself; skipping the job (rather than failing it) leaves no image
    # published and no deploy attempted, exactly as if this workflow had
    # never run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A workflow_run event checks out main by default, not the commit
          # CI actually tested - pin explicitly to the commit that earned
          # this run, so the image built here is the image CI passed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This repository deploys itself. The server's own repository holds neither
      # this stack's compose fragment nor its secrets - that repository owns the
      # base stack, this one owns the application. The compose project name
      # `opsidious-auth` is part of that contract: it namespaces the volumes.
      #
      # This step used to be gated on `workflow_run` alone, so a manual
      # `workflow_dispatch` built and published the image and then quietly
      # skipped the deploy - a green run that changed nothing on the server.
      # It also carried `continue-on-error: true`, which turned a failed deploy
      # into a green run as well. Both were silent, and together they made
      # "the workflow succeeded" say nothing about whether the service is
      # actually running.
      #
      # The fragment used to be fetched over HTTP from raw.githubusercontent.
      # That worked here only because this repository is public: the same line
      # returned 404 on the two private repositories and took tarkovxyz.com
      # offline. A deploy that depends on the repository staying public is a
      # trap waiting for the day it does not. The runner has just checked the
      # repository out at the exact commit CI passed - it HAS the file, so it
      # sends it over the SSH connection that is already open.
      #
      # The image is pushed by the step above, so letting this one fail loudly
      # costs nothing: the image is already published either way, and a red run
      # is the only honest report when the server was not updated.
      - name: Deploy to the server (SSH)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USERNAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
        run: |
          # Pas de `set -x` : une trace ferait echo aux lignes sur lesquelles
          # les secrets voyagent.
          set -euo pipefail

          # Sans MASTER_KEY, le service refuse de demarrer en production - et il
          # a raison : sans elle, la cle de signature et le pepper seraient
          # ecrits en clair, et une sauvegarde suffirait a forger un jeton pour
          # n'importe qui. Refuser ici nomme le secret manquant au lieu de
          # laisser un conteneur mourir en boucle.
          if [ -z "${MASTER_KEY:-}" ]; then
            echo "Le secret MASTER_KEY est vide ou absent du depot." >&2
            echo "Creez-le dans Settings > Secrets and variables > Actions." >&2
            echo "Generez une valeur avec : openssl rand -base64 32" >&2
            echo "ATTENTION : la changer rend les comptes existants irrecuperables." >&2
            exit 1
          fi

          # umask AVANT toute ecriture : entre la creation et un chmod
          # ulterieur, le fichier est lisible par tout le monde.
          # Meme raison que MASTER_KEY, apprise chez tarkovxyz : un secret
          # absent s'ecrit en valeur vide, le conteneur demarre, /healthz
          # repond, le run passe au vert -- et plus personne ne peut se
          # connecter. Sans client id, l'echange avec Google echoue des la
          # redirection ; sans client secret, il echoue a l'etape du jeton.
          #
          # Deux tests ecrits en toutes lettres plutot qu'une boucle sur les
          # noms : la boucle etait plus courte et illisible, et le controle de
          # deploiement du socle ne la reconnaissait pas comme une garde.
          if [ -z "${GOOGLE_CLIENT_ID:-}" ]; then
            echo "Le secret GOOGLE_CLIENT_ID est vide ou absent du depot." >&2
            echo "Sans lui, le service demarre mais aucune connexion n'aboutit." >&2
            echo "Sa valeur vient des identifiants OAuth de la console Google Cloud." >&2
            exit 1
          fi

          if [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "Le secret GOOGLE_CLIENT_SECRET est vide ou absent du depot." >&2
            echo "Sans lui, l'echange du code contre un jeton echoue a chaque connexion." >&2
            echo "Sa valeur vient des identifiants OAuth de la console Google Cloud." >&2
            exit 1
          fi

          umask 077
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          cat > secrets.env <<EOF
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          MASTER_KEY=${MASTER_KEY}
          EOF

          SSH_OPTS="-i $HOME/.ssh/id -o StrictHostKeyChecking=yes"

          # BACKUPS_DIR est passe a compose plutot qu'ecrit dans le fragment :
          # le chemin depend de l'utilisateur SSH, et le fragment est un fichier
          # public. Il est resolu sur le serveur, pas ici.
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST"             "mkdir -p ~/apps/opsidious-auth ~/opsidious-auth/backups && chmod 700 ~/apps/opsidious-auth"
          scp $SSH_OPTS deploy/docker-compose.yml secrets.env             "$SSH_USER@$SSH_HOST:~/apps/opsidious-auth/"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST"             "cd ~/apps/opsidious-auth && chmod 600 secrets.env && BACKUPS_DIR=\"\$HOME/opsidious-auth/backups\" docker compose -p opsidious-auth pull && BACKUPS_DIR=\"\$HOME/opsidious-auth/backups\" docker compose -p opsidious-auth up -d"

          # `up -d` rend la main des que le conteneur est CREE, pas quand
          # l'application fonctionne. Sans cette verification, un conteneur qui
          # meurt au demarrage laisse un run vert et un domaine en 404. Le
          # demarrage ouvre la base, lit-ou-frappe le pepper et la premiere cle,
          # puis balaye et sauvegarde : 60 s couvrent largement.
          echo "Verification que le service repond..."
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" '
            for i in $(seq 1 30); do
              if docker exec opsidious-auth wget -q -O- http://127.0.0.1:4570/healthz >/dev/null 2>&1; then
                echo "opsidious-auth repond"; exit 0
              fi
              sleep 2
            done
            echo "opsidious-auth ne repond pas apres 60 s :" >&2
            docker ps -a --filter name=opsidious-auth --format "{{.Names}} | {{.Status}}" >&2
            docker logs opsidious-auth 2>&1 | tail -30 >&2
            exit 1'

          rm -f ~/.ssh/id secrets.env
          echo "opsidious-auth redeployed"
