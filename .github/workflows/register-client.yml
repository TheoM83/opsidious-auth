# Enregistre une application et dépose son secret là où elle le lira.
#
# Le secret est produit sur le serveur et consommé sur le serveur. Le faire
# voyager jusqu'aux secrets GitHub pour qu'il en redescende, c'est le promener
# pour rien — et c'est ce qui imposait un jeton personnel avec `secrets: write`
# sur un autre dépôt. Il ne bouge plus : il est écrit directement dans
# `~/apps/<client_id>/opsidious.env`, que le fragment compose de l'application
# lit déjà.
#
# Il n'est affiché nulle part. Les journaux d'Actions sont lisibles par
# quiconque a accès au dépôt, et celui-ci est public.
name: Enregistrer une application

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Identifiant, ex. defnote. Devient le `aud` de chaque jeton émis.'
        required: true
      redirect_uri:
        description: 'URL de callback. Comparée EXACTEMENT — une barre finale est une autre URL.'
        required: true

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Enregistrer et déposer le secret
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USERNAME }}
          CLIENT_ID: ${{ inputs.client_id }}
          REDIRECT_URI: ${{ inputs.redirect_uri }}
        run: |
          # Pas de `set -x` : une trace ferait écho à la ligne de commande sur
          # laquelle le secret voyage, ce qui annulerait tout l'intérêt.
          set -euo pipefail

          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Tout se passe sur le serveur, en une session : le secret est
          # produit et écrit sans jamais remonter jusqu'au runner.
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             DIR=\"\$HOME/apps/$CLIENT_ID\"
             mkdir -p \"\$DIR\"
             umask 077
             SECRET=\"\$(docker exec opsidious-auth node scripts/register-client.mjs \
               --secret-only '$CLIENT_ID' '$CLIENT_ID' '$REDIRECT_URI')\"
             printf 'OPSIDIOUS_CLIENT_ID=%s\nOPSIDIOUS_CLIENT_SECRET=%s\n' \
               '$CLIENT_ID' \"\$SECRET\" > \"\$DIR/opsidious.env\"
             # Redémarre l'application si elle est déjà déployée, pour qu'elle
             # prenne le secret tout de suite plutôt qu'au prochain déploiement.
             if [ -f \"\$DIR/docker-compose.yml\" ]; then
               docker compose -p '$CLIENT_ID' -f \"\$DIR/docker-compose.yml\" up -d
             fi"

          rm -f ~/.ssh/id

          echo "Enregistré : $CLIENT_ID"
          echo "Secret déposé dans ~/apps/$CLIENT_ID/opsidious.env sur le serveur."
          echo "Il n'a été affiché nulle part et ne peut plus être relu — seul son"
          echo "hash est stocké. Relancez ce workflow pour le renouveler."
