<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opsidious Auth share card</title>
<style>
  /* Rendered by tools/render-og.mjs at exactly 1200×630, so every length here
     is a pixel rather than a percentage: the card has one size and there is no
     second one to be responsive to.

     The faces and the logo are the repository's own files, read off the disk
     (the renderer passes --allow-file-access-from-files), so the card cannot
     drift from what the service actually serves. */
  @font-face { font-family: 'Space Grotesk'; font-weight: 300 700; src: url('../public/fonts/space-grotesk-var-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../public/fonts/inter-var-latin.woff2') format('woff2'); }

  :root {
    --ink: #0b0d12;
    --mist: #e3e7ee;
    --stone: #9aa4b2;
    --accent: #8a6cff;
    --display: 'Space Grotesk', sans-serif;
    --text: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--ink);
    color: var(--mist);
  }

  /* The accent glow behind the mark, as on the identity's social banner. */
  .glow {
    position: absolute;
    right: -140px;
    top: -170px;
    width: 760px;
    height: 760px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 62%);
    opacity: 0.2;
  }

  /* The Opsidious Auth symbol, large, on the right: the A and its keyhole. */
  .mark {
    position: absolute;
    right: 110px;
    top: 150px;
    width: 330px;
    height: 312px;
  }
  .mark svg { display: block; width: 100%; height: 100%; }

  .logo {
    position: absolute;
    left: 76px;
    top: 64px;
    width: 280px;
    height: auto;
  }

  .text {
    position: absolute;
    left: 76px;
    top: 190px;
    max-width: 640px;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--text);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 26px;
  }
  .eyebrow i {
    width: 12px;
    height: 16px;
    background: var(--accent);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 64px;
    line-height: 1.06;
    letter-spacing: -0.03em;
  }
  h1 em { font-style: normal; color: var(--accent); }

  .foot {
    position: absolute;
    left: 76px;
    bottom: 62px;
    display: flex;
    align-items: baseline;
    gap: 18px;
    font-family: var(--text);
    font-size: 19px;
    letter-spacing: 0.02em;
  }
  .foot .domain { color: var(--mist); font-weight: 600; }
  .foot .sep { color: #3c4452; }
  .foot .note { color: var(--stone); }

  /* The accent rule along the bottom edge, as on the business card. */
  .rule {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 6px;
    background: var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>

    <img class="logo" src="../logo/svg/opsidious-auth-horizontal-blanc.svg" alt="Opsidious Auth">

    <div class="mark">
      <svg viewBox="6 6 108 102" role="presentation">
        <path fill="#e3e7ee" d="M60 6 L114 108 L86 108 L60 46 L34 108 L6 108 Z"/>
        <path fill="#8a6cff" d="M60 66 A10 10 0 0 1 65.8 84.14 L69.5 101 L50.5 101 L54.2 84.14 A10 10 0 0 1 60 66 Z"/>
      </svg>
    </div>

    <div class="text">
      <p class="eyebrow"><i></i><span id="eyebrow">Identity service</span></p>
      <h1 id="headline">An identity<br>that <em>does not</em><br>follow you.</h1>
    </div>

    <p class="foot">
      <span class="domain">auth.opsidious.com</span>
      <span class="sep">/</span>
      <span class="note" id="foot-note">open registration · no email · no name</span>
    </p>

    <div class="rule"></div>
  </div>

<script>
  // ?lang=fr renders the French card from this same file, so the two can never
  // drift into different layouts.
  if (new URLSearchParams(location.search).get('lang') === 'fr') {
    document.documentElement.lang = 'fr';
    document.getElementById('eyebrow').textContent = 'Service d’identité';
    document.getElementById('headline').innerHTML =
      'Une identité<br>qui <em>ne vous suit</em><br>pas.';
    document.getElementById('foot-note').textContent =
      'enregistrement ouvert · sans e-mail · sans nom';
  }
</script>
</body>
</html>
